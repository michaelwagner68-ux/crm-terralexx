<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0C; --ink-2:#1A1B1F; --ink-3:#3A3D45;
  --paper:#FFFFFF; --surface:#F4F5F7; --surface-2:#EEF0F4;
  --line:#E1E4EA; --line-2:#CFD4DD;
  --brand:#7D95D2; --brand-deep:#3D5AA9; --brand-deeper:#2F4886; --brand-tint:#EDF1FA;
  --ok:#2E7D5B; --ok-tint:#E7F3ED;
  --warn:#B87413; --warn-tint:#FBF1E1;
  --bad:#B23A3A; --bad-tint:#FAEBEB;
  --muted:#6B7280;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --sh-1:0 1px 2px rgba(11,11,12,.06),0 1px 3px rgba(11,11,12,.04);
  --sh-2:0 8px 28px rgba(11,11,12,.12);
  --rail:248px;
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:Archivo,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-deep)}
:focus-visible{outline:2px solid var(--brand-deep);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Typo-Utilities ---------- */
.eyebrow{font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.strong{font-weight:600}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Signature: Kennzeichner-Chip ---------- */
.kz{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.04em;
  background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.kz b{font-weight:600}
.kz .kz-sep{color:var(--line-2)}
.kz-own{color:var(--brand-deep);font-weight:600}
.kz-lg{font-size:13px;padding:4px 10px}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--ink);color:#A6ABB5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-logo{padding:22px 20px 18px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.rail-logo .row{flex-wrap:nowrap}
.wordmark{font-family:Archivo;font-weight:400;font-size:21px;letter-spacing:-.01em;color:#fff;line-height:1}
.wordmark b{font-weight:800}
.rail-scroll{overflow-y:auto;flex:1;padding:4px 12px 20px}
.nav-group{margin-top:18px}
.nav-group .eyebrow{padding:0 10px 8px;color:#5C616B;font-size:10px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:8px 10px;border-radius:var(--r-s);color:#A6ABB5;cursor:pointer;font-size:13.5px;font-weight:500;position:relative}
.nav-item:hover{background:#17181C;color:#E6E8EC}
.nav-item.on{background:#1E2026;color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;background:var(--brand);border-radius:0 3px 3px 0}
.nav-item .ico{width:18px;text-align:center;opacity:.9}
.nav-badge{margin-left:auto;background:var(--brand-deep);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav-badge.due{background:var(--bad)}
.rail-foot{border-top:1px solid #1E2026;padding:12px;display:flex;align-items:center;gap:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20}
.page{padding:22px 26px 60px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:25px;font-weight:700}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.spacer{flex:1}

/* ---------- Karten ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh-1)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{font-size:14.5px;font-weight:700}
.card-b{padding:16px}
.card-b.tight{padding:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
  padding:7px 13px;border-radius:var(--r-s);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface);border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.accent{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
.btn.accent:hover{background:var(--brand-deeper)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{background:var(--bad-tint);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);padding:5px;border-radius:var(--r-s);line-height:1}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}

/* ---------- Formulare ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.inp{border:1px solid var(--line-2);background:var(--paper);border-radius:var(--r-s);padding:7px 10px;font-size:13.5px;width:100%}
.inp:focus{outline:none;border-color:var(--brand-deep);box-shadow:0 0 0 3px var(--brand-tint)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.5}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%236B7280' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid transparent;border-radius:var(--r-s);padding:7px 11px;min-width:220px;flex:1;max-width:440px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13.5px}
.page-head .search,.card-b .search{background:var(--paper);border-color:var(--line-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}

/* ---------- Tabelle ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-family:Archivo;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding:10px 13px;border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr > *:last-child{padding-right:16px}
.tbl .nw{white-space:nowrap}
.tbl .cap{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1300px){.tbl .hide-md{display:none}}
@media(max-width:1000px){.tbl .hide-sm{display:none}}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--brand-tint)}
.tbl-wrap{overflow-x:auto}

/* ---------- Chips / Badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.chip.ok{background:var(--ok-tint);color:var(--ok)} .chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.bad{background:var(--bad-tint);color:var(--bad)} .chip.brand{background:var(--brand-tint);color:var(--brand-deep)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.ava{width:26px;height:26px;border-radius:50%;background:var(--brand-tint);color:var(--brand-deep);display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;font-family:Archivo;flex:0 0 26px;letter-spacing:.02em}
.ava.dark{background:#1E2026;color:#fff}
.ava.lg{width:38px;height:38px;flex-basis:38px;font-size:13px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:15px 16px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.kpi .v{font-family:Archivo;font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.alert{border-color:#EAC9C9;background:linear-gradient(180deg,#FDF4F4,#fff 60%)}
.kpi.alert .v{color:var(--bad)}

/* ---------- Pipeline Board ---------- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--surface-2);border-radius:var(--r-m);border:1px solid transparent;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--brand-deep);background:var(--brand-tint)}
.col-h{padding:11px 13px;border-bottom:1px solid var(--line);position:sticky;top:0}
.col-h .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col-h h4{font-size:12.5px;font-weight:700;letter-spacing:.01em}
.col-body{padding:9px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.deal{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:var(--sh-1)}
.deal:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.deal.drag{opacity:.4}
.deal .t{font-weight:600;font-size:13px;line-height:1.3;margin-bottom:6px}
.deal .v{font-family:Archivo;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px}
.tl-i::before{content:"";position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:2px solid var(--line-2)}
.tl-i.done::before{background:var(--ok);border-color:var(--ok)}
.tl-i.due::before{background:var(--bad);border-color:var(--bad)}

/* ---------- Bars ---------- */
.bar-row{display:grid;grid-template-columns:150px 1fr 78px;gap:12px;align-items:center;padding:7px 0}
.bar{height:20px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand-deep);border-radius:4px}
.cols-2{grid-template-columns:1.25fr .95fr}
@media(max-width:1100px){.cols-2{grid-template-columns:1fr}}
.funnel{display:flex;flex-direction:column;gap:6px}
.fn{display:flex;align-items:center;gap:10px}
.fn .b{height:30px;background:linear-gradient(90deg,var(--brand-deep),var(--brand));border-radius:4px;min-width:3px;display:flex;align-items:center;padding:0 9px;color:#fff;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- Modal / Drawer ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,11,12,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--paper);border-radius:var(--r-l);box-shadow:var(--sh-2);width:100%;max-width:660px;overflow:hidden}
.modal.wide{max-width:900px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:20px;max-height:calc(100vh - 230px);overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;justify-content:flex-end}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:60;box-shadow:var(--sh-2);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer-h{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px}
.drawer-b{overflow-y:auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:14px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 13px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab:hover{color:var(--ink)}

/* ---------- Sonstiges ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-s);
  box-shadow:var(--sh-2);z-index:90;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:center}
.toast.err{background:var(--bad)}
.file{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
.file .ft{width:34px;height:34px;border-radius:6px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;font-family:Archivo;color:var(--ink-3)}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:22px;text-align:center;color:var(--muted);background:var(--paper);cursor:pointer}
.drop.over{border-color:var(--brand-deep);background:var(--brand-tint);color:var(--brand-deep)}
.note{background:var(--brand-tint);border:1px solid #D5DEF3;border-radius:var(--r-s);padding:10px 13px;font-size:12.5px;color:var(--ink-3)}
.note.warn{background:var(--warn-tint);border-color:#EEDCBC}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-s);padding:2px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px;align-items:center;width:100%}
.filters .search{max-width:none;min-width:0;flex:none;background:var(--surface)}
.filters .sortbar{grid-column:1/-1;display:flex;justify-content:flex-end}
@media(min-width:1180px){.filters .wide{grid-column:span 2}.filters .sortbar{grid-column:auto;justify-content:flex-start}}
.range{display:flex;align-items:flex-end;gap:8px}
.range .inp{width:auto}
.seg button{border:0;background:none;padding:5px 11px;border-radius:4px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:var(--sh-1)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-art{background:var(--ink);color:#fff;padding:54px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--ink-2) 1px,transparent 1px),linear-gradient(90deg,var(--ink-2) 1px,transparent 1px);background-size:46px 46px;opacity:.65}
.login-art .cnt{position:relative}
.login-art h2{font-size:40px;line-height:1.06;font-weight:800;letter-spacing:-.035em;max-width:12ch}
.login-art h2 em{font-style:normal;color:var(--brand)}
.login-form{background:var(--paper);display:flex;align-items:center;justify-content:center;padding:36px}
.login-box{width:100%;max-width:340px}
.login-box img{height:34px;margin-bottom:26px}
@media(max-width:860px){.login{grid-template-columns:1fr}.login-art{display:none}}

/* ---------- Responsive ---------- */
@media(max-width:960px){
  .app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto}
  .rail-logo{padding:12px 14px}
  .wordmark{font-size:18px}
  .rail-scroll{display:flex;gap:4px;padding:8px 12px;overflow-x:auto}
  .nav-group{margin:0;display:flex;gap:4px}
  .nav-group .eyebrow{display:none}
  .nav-item.on::before{display:none}
  .rail-foot{border:0}
  .tbl th{position:static}
  .page{padding:16px}
  .topbar{padding:0 14px}
}
</style>

<script>/* =========================================================================
   TERRALEXX CRM – Anbindung an den Server

   Die Anwendung läuft in zwei Betriebsarten:

   "server"  Es gibt eine Netlify-Function unter /api. Anmeldung, Daten und
             Berechtigungen liegen auf dem Server; alle Benutzer arbeiten auf
             demselben Bestand. Passwörter werden nur dort geprüft.
   "lokal"   Kein /api erreichbar (Datei lokal geöffnet, reine Vorführung).
             Dann greift wie bisher der Browserspeicher.

   Welche Art gilt, ermittelt probeBackend() beim Start. Der übrige Code der
   Anwendung bleibt unverändert: Änderungen laufen weiter über setDb, hier
   wird der Unterschied zum vorigen Stand ermittelt und als Liste von
   Operationen an den Server geschickt.
   ========================================================================= */

const API = "/api";
const TOKEN_KEY = "terralexx_crm_token";
const Backend = {
  modus: "unbekannt",
  // "server" | "lokal"
  token: null,
  online: true,
  letzterFehler: null
};
async function apiCall(pfad, {
  method = "GET",
  body,
  token
} = {}) {
  const res = await fetch(API + "/" + pfad, {
    method,
    headers: {
      "content-type": "application/json",
      ...(token || Backend.token ? {
        authorization: "Bearer " + (token || Backend.token)
      } : {})
    },
    body: body ? JSON.stringify(body) : undefined
  });
  let daten = null;
  try {
    daten = await res.json();
  } catch (e) {}
  if (!res.ok) {
    const err = new Error(daten && daten.error || "Serverfehler " + res.status);
    err.status = res.status;
    throw err;
  }
  return daten;
}

/* Prüft einmalig, ob ein Server vorhanden ist. */
async function probeBackend() {
  try {
    const res = await fetch(API + "/state", {
      method: "GET"
    });
    /* 401 heißt: Server da, nur nicht angemeldet - genau das erwarten wir. */
    if (res.status === 401 || res.ok) {
      Backend.modus = "server";
      return "server";
    }
    if (res.status === 503) {
      Backend.modus = "server";
      Backend.letzterFehler = "Datenbank nicht erreichbar";
      return "server";
    }
  } catch (e) {/* Netzwerkfehler oder file:// - dann lokal */}
  Backend.modus = "lokal";
  return "lokal";
}

/* ------------------------------------------------- Unterschied ermitteln -
   Vergleicht zwei Datenbestände und liefert die Liste der Änderungen.
   Verglichen wird über JSON, das genügt bei dieser Datenmenge und erspart
   eine Änderungsverfolgung quer durch die gesamte Anwendung.              */
const ENTITIES = [{
  feld: "contacts",
  entity: "contact"
}, {
  feld: "deals",
  entity: "deal"
}, {
  feld: "activities",
  entity: "activity"
}, {
  feld: "documents",
  entity: "document"
}];
const CONFIG_FELDER = ["companies", "channels", "stages", "templates", "settings"];
function diffDB(alt, neu) {
  const ops = [];
  if (!alt) return ops;
  ENTITIES.forEach(({
    feld,
    entity
  }) => {
    const a = new Map((alt[feld] || []).map(x => [x.id, x]));
    const b = new Map((neu[feld] || []).map(x => [x.id, x]));
    b.forEach((wert, id) => {
      const vorher = a.get(id);
      if (!vorher || JSON.stringify(vorher) !== JSON.stringify(wert)) ops.push({
        entity,
        action: "put",
        id,
        data: wert
      });
    });
    a.forEach((_, id) => {
      if (!b.has(id)) ops.push({
        entity,
        action: "delete",
        id
      });
    });
  });
  CONFIG_FELDER.forEach(feld => {
    if (JSON.stringify(alt[feld]) !== JSON.stringify(neu[feld])) ops.push({
      entity: "config",
      action: "put",
      id: feld,
      data: neu[feld]
    });
  });
  const ua = new Map((alt.users || []).map(u => [u.id, u]));
  const ub = new Map((neu.users || []).map(u => [u.id, u]));
  ub.forEach((wert, id) => {
    const vorher = ua.get(id);
    if (!vorher || JSON.stringify(vorher) !== JSON.stringify(wert)) ops.push({
      entity: "user",
      action: "put",
      id,
      data: wert
    });
  });
  ua.forEach((_, id) => {
    if (!ub.has(id)) ops.push({
      entity: "user",
      action: "delete",
      id
    });
  });
  return ops;
}

/* Dokumentinhalt wird erst beim Herunterladen geholt, damit der Datenbestand
   klein bleibt. Im lokalen Betrieb liegt er ohnehin schon vor. */
async function ladeDokument(doc) {
  if (doc.dataUrl) return doc.dataUrl;
  if (Backend.modus !== "server") return null;
  const r = await apiCall("document?id=" + encodeURIComponent(doc.id));
  return r.dataUrl;
}

const mem = {};

      return true;

  get(k) {
    try {
      return this.ok ? localStorage.getItem(k) : mem[k] ?? null;
    } catch (e) {
      return mem[k] ?? null;
    }
  },
  set(k, v) {
    try {
      this.ok ? localStorage.setItem(k, v) : mem[k] = v;
    } catch (e) {
      mem[k] = v;
      throw e;
    }
  },
  del(k) {
    try {
      this.ok ? localStorage.removeItem(k) : delete mem[k];
    } catch (e) {
      delete mem[k];

  }

/* ------------------------------------------------------- Datei-Download - */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* --------------------------------------------------------------- ZIP ---- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ c >>> 1 : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ c >>> 8;
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [],
    central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true);
    lh.setUint16(12, 0x2821, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, 0, true);
    cd.setUint16(14, 0x2821, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true);
    cd.setUint32(24, data.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;

  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true);
  eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true);
  eocd.setUint32(16, offset, true);

const xmlEsc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/\x00-\x08|\x0B|\x0C|\x0E-\x1F/g, "");
const colName = n => {
  let s = "";

    const m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = (n - m - 1) / 26;
  }
  return s;

  const d = new Date((iso || "").slice(0, 10) + "T12:00:00Z");

  return Math.floor((d - new Date("1899-12-30T12:00:00Z")) / 864e5);

/* Erkennt Trennzeichen, versteht Anführungszeichen und Zeilenumbrüche darin */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const head = text.slice(0, 4000);
  const counts = [[";", (head.match(/;/g) || []).length], [",", (head.match(/,/g) || []).length], ["\t", (head.match(/\t/g) || []).length], ["|", (head.match(/\|/g) || []).length]];
  const sep = counts.sort((a, b) => b[1] - a[1])[0][1] > 0 ? counts[0][0] : ";";
  const rows = [];
  let row = [],
    cell = "",
    q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          cell += '"';
          i++;
        } else q = false;
      } else cell += c;
    } else if (c === '"') q = true;else if (c === sep) {
      row.push(cell);
      cell = "";
    } else if (c === "\n") {
      row.push(cell);
      rows.push(row);
      row = [];
      cell = "";
    } else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) {
    row.push(cell);
    rows.push(row);
  }
  return {
    sep,
    rows: rows.filter(r => r.some(v => (v || "").trim() !== "")).map(r => r.map(v => v.trim()))
  };
}

/* Schlägt anhand der Spaltenüberschrift ein Zielfeld vor */
function guessMapping(headers) {
  const used = new Set(),
    map = {};
  const low = headers.map(h => (h || "").toLowerCase().trim());
  /* erst exakte Treffer, dann Teiltreffer - sonst greift ein kurzes
     Stichwort wie "typ" frueher als die genauere Spaltenbezeichnung */
  [true, false].forEach(exact => {
    low.forEach((h, i) => {
      if (map[i]) return;
      const hit = IMPORT_FIELDS.find(f => !used.has(f.key) && f.hints.some(x => exact ? h === x || h === f.label.toLowerCase() : h.includes(x)));
      if (hit) {
        map[i] = hit.key;
        used.add(hit.key);
      }
    });
  });
  /* eine Spalte, die schlicht "Name" heisst, wird zum Nachnamen */
  low.forEach((h, i) => {
    if (!map[i] && /^name$/.test(h) && !used.has("nachname") && !used.has("person")) {
      map[i] = "nachname";
      used.add("nachname");
    }
  });
  return map;
}

/* Entpackt eine XLSX-Datei im Browser (ZIP mit „deflate-raw") und liest die
   Arbeitsblätter. Keine Fremdbibliothek nötig.                              */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf) {
  const view = new DataView(buf),
    bytes = new Uint8Array(buf),
    dec = new TextDecoder();
  /* End of Central Directory suchen */
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) {
    if (view.getUint32(i, true) === 0x06054b50) {
      eocd = i;
      break;
    }
  }
  if (eocd < 0) throw new Error("Kein gültiges ZIP-Archiv");
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true);
    const csize = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const cmtLen = view.getUint16(p + 32, true);
    const lho = view.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = view.getUint16(lho + 26, true);
    const lExtraLen = view.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(start, start + csize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}
const xlDate = n => {
  const d = new Date(Date.UTC(1899, 11, 30) + Math.round(Number(n)) * 864e5);
  return isNaN(d) ? "" : d.toISOString().slice(0, 10);
};
/* Liefert [{name, rows}] – rows sind Arrays aus Zeichenketten */
async function readXLSX(arrayBuffer) {
  const files = await unzip(arrayBuffer);
  const dec = new TextDecoder();
  const parse = name => files[name] ? new DOMParser().parseFromString(dec.decode(files[name]), "application/xml") : null;

  /* gemeinsame Zeichenketten */
  const shared = [];
  const sst = parse("xl/sharedStrings.xml");
  if (sst) [...sst.getElementsByTagName("si")].forEach(si => {
    shared.push([...si.getElementsByTagName("t")].filter(t => t.parentNode.nodeName !== "rPh").map(t => t.textContent).join(""));
  });

  /* Formate, um Datumszellen zu erkennen */
  const dateStyles = new Set();
  const st = parse("xl/styles.xml");
  if (st) {
    const custom = new Set();
    [...st.getElementsByTagName("numFmt")].forEach(f => {
      const code = f.getAttribute("formatCode") || "";
      if (/[dmyhs]/i.test(code) && !/[#0]/.test(code.replace(/\[[^\]]*\]/g, ""))) custom.add(f.getAttribute("numFmtId"));
    });
    const xfs = st.getElementsByTagName("cellXfs")[0];
    if (xfs) [...xfs.getElementsByTagName("xf")].forEach((xf, i) => {
      const id = xf.getAttribute("numFmtId");
      if (custom.has(id) || Number(id) >= 14 && Number(id) <= 22 || Number(id) >= 45 && Number(id) <= 47) dateStyles.add(i);
    });
  }

  /* Blattnamen aus der Arbeitsmappe und ihre Ziele */
  const wb = parse("xl/workbook.xml"),
    rels = parse("xl/_rels/workbook.xml.rels");
  const relMap = {};
  if (rels) [...rels.getElementsByTagName("Relationship")].forEach(r => relMap[r.getAttribute("Id")] = r.getAttribute("Target").replace(/^\/?xl\//, ""));
  const sheets = [];
  if (wb) [...wb.getElementsByTagName("sheet")].forEach(s => {
    const rid = s.getAttribute("r:id") || s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    sheets.push({
      name: s.getAttribute("name"),
      path: "xl/" + (relMap[rid] || "")
    });
  });
  const colIdx = ref => {
    let n = 0;
    for (const ch of ref.replace(/[0-9]/g, "")) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  };
  return sheets.map(sh => {
    const doc = parse(sh.path);
    const rows = [];
    if (doc) [...doc.getElementsByTagName("row")].forEach(row => {
      const arr = [];
      [...row.getElementsByTagName("c")].forEach(c => {
        const ref = c.getAttribute("r") || "";
        const i = ref ? colIdx(ref) : arr.length;
        const t = c.getAttribute("t");
        const sIdx = Number(c.getAttribute("s") || -1);
        let v = "";
        if (t === "inlineStr") v = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");else {
          const vEl = c.getElementsByTagName("v")[0];
          const raw = vEl ? vEl.textContent : "";
          if (t === "s") v = shared[Number(raw)] ?? "";else if (t === "b") v = raw === "1" ? "ja" : "nein";else if (raw !== "" && dateStyles.has(sIdx) && !isNaN(Number(raw))) v = xlDate(raw);else v = raw;
        }
        arr[i] = String(v ?? "").trim();
      });
      for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = "";
      rows.push(arr);
    });
    /* leere Zeilen am Ende und komplett leere Zeilen entfernen */
    return {
      name: sh.name,
      rows: rows.filter(r => r.some(v => (v || "") !== ""))
    };
  });
}

/* Platzhalter, die in gepflegten Listen als „noch zu klären" stehen */
const PLACEHOLDER = /^(rufnr\.?\s*recherchieren|recherchieren|unbekannt|folgt|tbd|n\/?a|k\.?\s?a\.?|\?+|-+)$/i;
const clean = v => {
  const s = (v || "").trim();
  return PLACEHOLDER.test(s) ? "" : s;
};
const ANREDEN = ["Herr", "Frau", "Herrn", "Divers"];
/* „Herr Timo Dotschkal" → {anrede, vorname, nachname} */
function splitPerson(text) {
  let t = clean(text).replace(/\s+/g, " ").trim();
  if (!t) return {
    anrede: "",
    vorname: "",
    nachname: ""
  };
  let anrede = "";
  const first = t.split(" ")[0];
  if (ANREDEN.some(a => a.toLowerCase() === first.toLowerCase())) {
    anrede = /^herrn?$/i.test(first) ? "Herr" : first.replace(/^./, c => c.toUpperCase());
    t = t.slice(first.length).trim();
  }
  /* Titel abtrennen, aber nicht verlieren */
  const titel = [];
  while (/^(dr\.?|prof\.?|dipl\.-?\w*\.?|mag\.?|ing\.?)$/i.test(t.split(" ")[0] || "")) {
    titel.push(t.split(" ")[0]);
    t = t.slice(t.split(" ")[0].length).trim();
  }
  if (t.includes(",")) {
    /* „Dotschkal, Timo" */
    const [n, v] = t.split(",");
    return {
      anrede,
      vorname: (v || "").trim(),
      nachname: (n || "").trim()
    };
  }
  const parts = t.split(" ").filter(Boolean);
  if (parts.length === 0) return {
    anrede,
    vorname: "",
    nachname: ""
  };
  if (parts.length === 1) return {
    anrede,
    vorname: "",
    nachname: parts[0]
  };
  return {
    anrede,
    vorname: parts.slice(0, -1).join(" "),
    nachname: parts[parts.length - 1]
  };
}

/* Liefert eine Funktion, die fortlaufende Kennzeichner je Mandant vergibt.  */
function kzFactory(db) {
  const yy = String(new Date().getFullYear()).slice(2);
  const counter = {};
  db.companies.forEach(c => {
    counter[c.id] = db.contacts.filter(k => k.kennzeichner && k.kennzeichner.startsWith(c.code + "-" + yy + "-")).reduce((m, k) => Math.max(m, Number(k.kennzeichner.split("-")[2]) || 0), 0);
  });
  return companyId => {
    const c = db.companies.find(x => x.id === companyId) || db.companies[0];
    counter[c.id] = (counter[c.id] || 0) + 1;
    return c.code + "-" + yy + "-" + pad(counter[c.id], 4);
  };
}
